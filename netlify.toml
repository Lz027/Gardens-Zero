[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "22"

# Serve static files from dist first, then hand everything else
# to the server-rendered function produced by the build.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

[dev]
  command = "npm run dev"
  framework = "#custom"
  targetPort = 8080
  port = 8889
